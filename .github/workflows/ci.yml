name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # 零依赖：全部脚本只用标准库，所以不需要 pip install
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  docs:
    name: docs consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 版本徽章 / 阶段数 / 审计条数 / 章节引用 / 双语对齐 / 相对链接
      - name: Check documentation consistency
        run: python scripts/check_docs.py

      # 参考示例必须自身干净——否则规则或示例有一方写错了
      - name: Lint the reference examples
        run: |
          python scripts/lint_resume.py references/example-battery.md --strict
          python scripts/lint_resume.py references/example-student-work.md --strict
          python scripts/lint_resume.py references/example-software.md --strict
          python scripts/lint_resume.py references/example-delivery.md --strict

      # 参考示例的时间线也必须自洽
      - name: Check the example timeline
        run: python scripts/check_timeline.py references/example-delivery.md --today 2026.10

      - name: Check that lint actually catches a broken resume
        run: |
          cat > /tmp/bad.md <<'EOF'
          # 反例：以下每一条都应该被 lint 抓到
          - 参与模型训练，自主研发了预测系统，效果提升 40%；
          - 独立实现了自动化评估管线，把每次跑测的时间从 3 小时压缩到 12 分钟，并在团队内推广使用，后续又被另外两个小组复用，形成了可复用的标准流程模板与文档，另外还补齐了完整的回归测试、CI 流水线与交接说明；
          EOF
          set +e
          out=$(python scripts/lint_resume.py /tmp/bad.md)
          code=$?
          set -e
          echo "$out"
          # 期望：有 ERROR → 退出码 2；R1/R2/R4 均命中
          [ "$code" -eq 2 ] || { echo "::error::反例应返回退出码 2，实际 $code"; exit 1; }
          echo "$out" | grep -q "R1" || { echo "::error::未抓到动词黑名单"; exit 1; }
          echo "$out" | grep -q "R2" || { echo "::error::未抓到红灯词"; exit 1; }
          echo "$out" | grep -q "R4" || { echo "::error::未抓到 bullet 超长"; exit 1; }

  scanners:
    name: end-to-end scanners
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: trace_numbers finds a real number and reports a missing one
        run: |
          mkdir -p /tmp/ws/results
          printf 'cell,mae\nB0005,5.9\n' > /tmp/ws/results/summary.csv
          cat > /tmp/draft.md <<'EOF'
          误差 5.9%；覆盖 174 人
          EOF
          set +e
          out=$(python scripts/trace_numbers.py /tmp/draft.md /tmp/ws)
          code=$?
          set -e
          echo "$out"
          [ "$code" -eq 1 ] || { echo "::error::有 MISS 时应返回 1，实际 $code"; exit 1; }
          echo "$out" | grep -q "\[HIT \] 5.9" || { echo "::error::5.9 应命中"; exit 1; }
          echo "$out" | grep -q "\[MISS\] 174" || { echo "::error::174 应报 MISS"; exit 1; }

      - name: trace_numbers excludes the draft itself
        run: |
          cp /tmp/draft.md /tmp/ws/draft.md
          set +e
          out=$(python scripts/trace_numbers.py /tmp/ws/draft.md /tmp/ws)
          set -e
          echo "$out"
          # 命中行格式是 文件:行号，标题行里的 draft.md 不算证据
          if echo "$out" | grep -qE "draft\.md:[0-9]+"; then
            echo "::error::交付稿自身不应作为证据"
            exit 1
          fi

      - name: scan_privacy catches a secret and never echoes it
        run: |
          # 用拼接构造样本，避免仓库里真的躺一个形似密钥的字符串
          printf 'key %s%s\n' 'sk-' 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' > /tmp/leak.md
          set +e
          out=$(python scripts/scan_privacy.py /tmp/leak.md)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -ne 2 ]; then
            echo "::error::有密钥时应返回 2，实际 $code"
            exit 1
          fi
          if ! echo "$out" | grep -q "OpenAI"; then
            echo "::error::未抓到 sk- 密钥"
            exit 1
          fi
          if echo "$out" | grep -q "AAAAAAAAAA"; then
            echo "::error::密钥被完整打印出来了"
            exit 1
          fi

      - name: scan_privacy passes a clean draft
        run: |
          printf '复现论文管线，官方划分中位误差 5.9%%。\n' > /tmp/clean.md
          python scripts/scan_privacy.py /tmp/clean.md

      - name: check_facts catches a cross-version conflict
        run: |
          mkdir -p /tmp/v
          cat > /tmp/v/facts.md <<'EOF'
          | 数字 | 口径 | 证据指针 | 取证方式 | 防守分 |
          |---|---|---|---|---|
          | 5.9% | 中位误差 | results/summary.csv | 读第 4 列 | 3 |
          | 174 | 打卡人数 | signin.csv | 数行数 | 2 |
          EOF
          printf -- '- 中位误差 5.9%%，覆盖 174 人；\n' > /tmp/v/a.md
          printf -- '- 中位误差 6.4%%，覆盖 174 人；\n' > /tmp/v/b.md
          set +e
          out=$(python scripts/check_facts.py /tmp/v/facts.md /tmp/v/a.md /tmp/v/b.md)
          code=$?
          set -e
          echo "$out"
          [ "$code" -eq 2 ] || { echo "::error::跨版本数字冲突应返回 2，实际 $code"; exit 1; }
          echo "$out" | grep -q "\[CONFLICT\]" || { echo "::error::未报出 CONFLICT"; exit 1; }
          echo "$out" | grep -q "6.4" || { echo "::error::未列出冲突值"; exit 1; }

      - name: check_facts exits zero when versions agree
        run: |
          cp /tmp/v/a.md /tmp/v/c.md
          python scripts/check_facts.py /tmp/v/facts.md /tmp/v/a.md /tmp/v/c.md

      - name: parse_jd extracts keywords and never invents them
        run: |
          printf '要求熟悉 Python 与 SQL，具备沟通协调能力。\n' > /tmp/jd.txt
          set +e
          out=$(python scripts/parse_jd.py /tmp/jd.txt --keywords-only)
          code=$?
          set -e
          echo "$out"
          [ "$code" -eq 0 ] || { echo "::error::抽词应返回 0，实际 $code"; exit 1; }
          echo "$out" | grep -q "Python" || { echo "::error::未抽出 Python"; exit 1; }
          echo "$out" | grep -q "沟通协调" || { echo "::error::未抽出中文软技能词"; exit 1; }
          if echo "$out" | grep -qi "Kubernetes"; then
            echo "::error::抽出了 JD 里没有的词"
            exit 1
          fi

      - name: check_timeline catches a reversed range
        run: |
          printf -- '- 毕业设计  2025.12-2025.09\n' > /tmp/tl.md
          set +e
          out=$(python scripts/check_timeline.py /tmp/tl.md --today 2026.10)
          code=$?
          set -e
          echo "$out"
          [ "$code" -eq 2 ] || { echo "::error::倒挂区间应返回 2，实际 $code"; exit 1; }
          echo "$out" | grep -q "REVERSED" || { echo "::error::未报出区间倒挂"; exit 1; }

      - name: check_timeline stays quiet on parallel experience
        run: |
          cat > /tmp/tl2.md <<'EOF'
          - XX大学 计算机（本科）  2022.09-2026.06
          - 后端实习生（全职）      2025.03-2025.06
          - 课程项目               2025.05-2025.09
          EOF
          set +e
          out=$(python scripts/check_timeline.py /tmp/tl2.md --today 2026.10)
          code=$?
          set -e
          echo "$out"
          # 教育背景不参与重叠；实习与课程项目重叠只算并行，不该是 WARN
          [ "$code" -eq 0 ] || { echo "::error::并行经历不应报错，实际 $code"; exit 1; }
          if echo "$out" | grep -q "\[WARN\]"; then
            echo "::error::并行经历被报成警告"
            exit 1
          fi
